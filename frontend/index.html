<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Flow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Task Flow</h1>

    <p id="storage-warning" class="storage-warning" role="alert" hidden></p>

    <form id="task-form" class="task-form" novalidate>
      <label for="task-title" class="visually-hidden">할 일 제목</label>
      <input id="task-title" name="title" type="text" placeholder="할 일 제목 (1~100자)" autocomplete="off">
      <button type="submit">등록</button>
    </form>
    <p id="form-error" class="form-error" role="alert"></p>

    <section class="task-section" aria-labelledby="task-list-heading">
      <h2 id="task-list-heading" class="section-title">할 일 목록</h2>
      <p id="empty-message" class="empty-message">등록된 할 일이 없습니다.</p>
      <ul id="task-list" class="task-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
