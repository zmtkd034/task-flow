# Task Flow Web 서버(Nginx) 설정.
# 설치 위치: /etc/nginx/sites-available/task-flow.conf (deploy/install-web.sh가 복사·활성화한다)
# 화면 파일은 /var/www/task-flow에서 제공하고, /api/ 요청만 App 서버(127.0.0.1:8001)로 전달한다.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/task-flow;
    index index.html;

    server_tokens off;
    # 할 일 요청 본문은 작다(설명 최대 2000자). 큰 요청은 App까지 보내지 않고 거절한다.
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # API만 App 서버로 전달한다. /docs 등 그 밖의 App 경로는 Web 주소로 노출하지 않는다.
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
